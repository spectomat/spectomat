name: Feature request
description: Propose a change to the flow.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "`references/decisions.md` records what was already rejected and why — please check it before proposing."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong today, or what is impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A phase brief (agents/)
        - A command (commands/)
        - A script (scripts/)
        - A template (templates/)
        - Docs or references
        - The spec itself
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
