name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS carries bash 3.2, which is the floor the scripts target.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Report versions
        run: |
          bash --version | head -1
          jq --version
          git --version

      - name: Check manifests are valid JSON
        run: |
          jq -e . .claude-plugin/plugin.json > /dev/null
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . package.json > /dev/null

      - name: Check the plugin version matches the marketplace entry
        run: |
          name=$(jq -r .name .claude-plugin/plugin.json)
          jq -e --arg n "$name" '.plugins | map(select(.name == $n)) | length == 1' \
            .claude-plugin/marketplace.json > /dev/null

      - name: Check package.json matches the plugin
        run: |
          # package.json exists so npm can install the plugin as a git dependency.
          jq -e -n --slurpfile p .claude-plugin/plugin.json --slurpfile k package.json \
            '$p[0].name == $k[0].name and $p[0].version == $k[0].version' > /dev/null

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          scripts/verify_all.sh
